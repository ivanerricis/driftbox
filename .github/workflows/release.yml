name: release

# A tag `v*` publishes a GitHub release. workflow_dispatch is a dry run: it builds everything and uploads the
# result as a workflow artifact, but never creates a tag or a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, as a tag (for example v0.1.0-rc1); the X.Y.Z part must match CMakeLists.txt'
        type: string
        required: true
        default: 'v0.1.0-rc1'

permissions:
  contents: read

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Tag must match CMake project version
        env:
          VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          scripts/ci/check_version.sh "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      installers: true

  release:
    name: publish GitHub release
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: driftbox-*
          path: dist
          merge-multiple: true

      - name: Verify artefacts and write SHA256SUMS.txt
        run: scripts/create-release-artifacts.sh dist --version "$VERSION"

      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      # Dry run (workflow_dispatch): keep the assets as a workflow artifact, no release, no tag.
      - name: Upload release assets (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ env.VERSION }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
            dist/*.pkg
            dist/SHA256SUMS.txt
            RELEASE_NOTES.md
          retention-days: 3
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
            dist/*.pkg
            dist/SHA256SUMS.txt
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
